version: '3.9'

services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketing_test
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  test-runner:
    build: .
    command: pytest --cov=. --cov-report=term-missing --cov-fail-under=70 -v
    environment:
      DATABASE_URL: postgres://ticketing:testpass@db-test:5432/ticketing_test
      REDIS_URL: redis://redis-test:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: test-secret-key
      QR_SECRET: test-qr-secret
    depends_on:
      db-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
